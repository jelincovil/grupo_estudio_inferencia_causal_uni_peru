name: verificar-plantillas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typst-y-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Instalar Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Dependencias Python (demo)
        run: pip install -r plantilla_tesis_uni_typst/requirements.txt
      - name: Coherencia cifras + compilación Typst
        run: |
          cd plantilla_tesis_uni_typst
          python3 verificar_cifras.py
          typst compile tesis.typ
          typst compile tesis_doctorado.typ

  latex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: TeX Live + latexmk
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra texlive-lang-spanish \
            texlive-science texlive-pictures biber
      - name: Compilar plantilla LaTeX
        working-directory: plantilla_tesis_uni_latex
        run: latexmk -pdf -interaction=nonstopmode tesis.tex
